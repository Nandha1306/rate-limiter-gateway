spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 100ms
      connect-timeout: 200ms

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false

logging:
  pattern:
    level: "%5p [%X{correlationId:-}] [%X{clientId:-}]"

gateway:
  instance:
    id: ${INSTANCE_ID:gateway-local}
  limiter:
    store: ${LIMITER_STORE:REDIS}
  timeouts:
    connect: 500ms
    read: 2s
  upstreams:
    mock:
      urls: ${MOCK_BACKEND_URLS:http://localhost:8081}
  api-keys:
    "[demo-free-key-1]":
      client-id: user_1
      tier: free
    "[demo-free-key-2]":
      client-id: user_2
      tier: free
    "[demo-premium-key-3]":
      client-id: user_3
      tier: premium
  routes:
    - id: orders
      path-prefix: /api/orders
      upstream: mock
      public-route: false
      algorithm: TOKEN_BUCKET
      failure-mode: LOCAL_FALLBACK
      default-tier: free
      tiers:
        free:
          limit: 60
          window-seconds: 60
          burst: 10
        premium:
          limit: 600
          window-seconds: 60
          burst: 100
    - id: products
      path-prefix: /api/products
      upstream: mock
      public-route: false
      algorithm: SLIDING_WINDOW_COUNTER
      failure-mode: FAIL_OPEN
      default-tier: free
      tiers:
        free:
          limit: 100
          window-seconds: 60
          burst: 0
        premium:
          limit: 1000
          window-seconds: 60
          burst: 0
    - id: login
      path-prefix: /auth/login
      upstream: mock
      public-route: true
      algorithm: SLIDING_WINDOW_LOG
      failure-mode: LOCAL_FALLBACK
      default-tier: anonymous
      tiers:
        anonymous:
          limit: 5
          window-seconds: 60
          burst: 0
    - id: demo-naive
      path-prefix: /api/demo/naive
      upstream: mock
      public-route: false
      algorithm: NAIVE_FIXED_WINDOW
      failure-mode: LOCAL_FALLBACK
      default-tier: free
      tiers:
        free:
          limit: 100
          window-seconds: 3600
          burst: 0
    - id: demo-lua
      path-prefix: /api/demo/lua
      upstream: mock
      public-route: false
      algorithm: TOKEN_BUCKET
      failure-mode: LOCAL_FALLBACK
      default-tier: free
      tiers:
        free:
          limit: 100
          window-seconds: 3600
          burst: 0

gateway:
  api-keys:
    "[rl-free-a]":
      client-id: rl_a
      tier: free
    "[rl-free-b]":
      client-id: rl_b
      tier: free
    "[rl-free-c]":
      client-id: rl_c
      tier: free
    "[rl-free-d]":
      client-id: rl_d
      tier: free
    "[rl-free-e]":
      client-id: rl_e
      tier: free
    "[rl-premium]":
      client-id: rl_p
      tier: premium
    "[rl-gold]":
      client-id: rl_g
      tier: gold
  routes:
    - id: limited
      path-prefix: /api/limited
      upstream: mock
      algorithm: TOKEN_BUCKET
      default-tier: free
      tiers:
        free:
          limit: 1
          window-seconds: 3600
          burst: 3
        premium:
          limit: 1
          window-seconds: 3600
          burst: 6
    - id: open
      path-prefix: /api/open
      upstream: mock
      algorithm: NONE
      default-tier: free
      tiers:
        free:
          limit: 1
          window-seconds: 3600
          burst: 1
    - id: public
      path-prefix: /public
      upstream: mock
      public-route: true
      default-tier: anonymous
      tiers:
        anonymous:
          limit: 1
          window-seconds: 3600
          burst: 2

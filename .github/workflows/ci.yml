name: CI

on:
  push:
    branches:
      - main
      - release
      - 'phase-*/**'
  pull_request:
    branches:
      - main
      - release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run all tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build gateway image
        run: docker build -t rlg-gateway:ci gateway

      - name: Build mock-backend image
        run: docker build -t rlg-mock-backend:ci mock-backend

      - name: Check images run as non-root
        run: |
          for image in rlg-gateway:ci rlg-mock-backend:ci; do
            uid=$(docker run --rm --entrypoint id "$image" -u)
            echo "$image runs as uid $uid"
            test "$uid" != "0"
          done
